[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blenderbox"
version = "0.2.0"
description = "Isolated stateful headless Blender sessions for coding agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blenderbox = "blenderbox.cli:main"

[tool.setuptools]
packages = ["blenderbox", "blenderbox_skills"]

[tool.setuptools.package-dir]
blenderbox_skills = "skills"

[tool.setuptools.package-data]
blenderbox_skills = ["*/SKILL.md", "*/references/*.md"]
